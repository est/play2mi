# play2mi · 书签版自动构建并部署到 GitHub Pages
#
# dist/ 不入库（见 .gitignore），所以用 Actions 现场构建：
#   node build.js        （拼接 p2m.js + 拷贝自包含的 index.html）
#   node dev/smoke.mjs   （零网络冒烟，保证没退化）
# 然后把 web/dist 作为 Pages 站点根发布——因此 p2m.js 的访问路径是 /<repo>/p2m.js。
#
# 使用：仓库 Settings → Pages → Source 选 "GitHub Actions"，本工作流即自动接管。
name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建 + 冒烟
        working-directory: web
        run: |
          node build.js
          node dev/smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
